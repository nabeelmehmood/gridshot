<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social preview card (1200×630). scripts/generate-assets.mjs fills in the theme badges. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1017"/>
      <stop offset="1" stop-color="#1c1236"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#ff4655" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff4655" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0.65"/>
    </linearGradient>
    <clipPath id="floorClip">
      <rect x="600" y="400" width="600" height="230"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Synthwave floor receding to the board. -->
  <g clip-path="url(#floorClip)" stroke="url(#fade)" stroke-width="2">
    <line x1="930" y1="400" x2="560" y2="630"/>
    <line x1="930" y1="400" x2="700" y2="630"/>
    <line x1="930" y1="400" x2="840" y2="630"/>
    <line x1="930" y1="400" x2="980" y2="630"/>
    <line x1="930" y1="400" x2="1120" y2="630"/>
    <line x1="930" y1="400" x2="1260" y2="630"/>
    <line x1="600" y1="430" x2="1200" y2="430"/>
    <line x1="600" y1="470" x2="1200" y2="470"/>
    <line x1="600" y1="525" x2="1200" y2="525"/>
    <line x1="600" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Target board with three targets, one under the crosshair mid-hit. -->
  <rect x="724" y="128" width="412" height="260" rx="8" fill="#f1e6cc" stroke="#8a5a3b" stroke-width="10"/>
  <g stroke="#e3d6b6" stroke-width="2">
    <line x1="792" y1="133" x2="792" y2="383"/>
    <line x1="861" y1="133" x2="861" y2="383"/>
    <line x1="930" y1="133" x2="930" y2="383"/>
    <line x1="999" y1="133" x2="999" y2="383"/>
    <line x1="1068" y1="133" x2="1068" y2="383"/>
  </g>
  <g>
    <circle cx="1052" cy="200" r="36" fill="#ff3d4f" stroke="#4a1a12" stroke-width="4"/>
    <circle cx="1040" cy="188" r="10" fill="#ffffff" opacity="0.3"/>
    <circle cx="820" cy="318" r="36" fill="#ff3d4f" stroke="#4a1a12" stroke-width="4"/>
    <circle cx="808" cy="306" r="10" fill="#ffffff" opacity="0.3"/>
    <circle cx="930" cy="230" r="36" fill="#ff3d4f" stroke="#4a1a12" stroke-width="4"/>
    <circle cx="918" cy="218" r="10" fill="#ffffff" opacity="0.3"/>
  </g>
  <!-- Hit sparks around the centre target. -->
  <g stroke="#ffd166" stroke-width="5" stroke-linecap="round">
    <line x1="930" y1="168" x2="930" y2="150"/>
    <line x1="984" y1="190" x2="998" y2="178"/>
    <line x1="992" y1="240" x2="1010" y2="244"/>
    <line x1="876" y1="190" x2="862" y2="178"/>
    <line x1="868" y1="240" x2="850" y2="244"/>
  </g>
  <!-- Crosshair. -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="930" y1="196" x2="930" y2="214"/>
    <line x1="930" y1="246" x2="930" y2="264"/>
    <line x1="896" y1="230" x2="914" y2="230"/>
    <line x1="946" y1="230" x2="964" y2="230"/>
  </g>

  <!-- Copy. -->
  <text x="80" y="232" fill="#ffffff" font-family="Arial Black, Segoe UI Black, Impact, sans-serif" font-size="84" font-weight="900" letter-spacing="8">GRIDSHOT</text>
  <text x="82" y="296" fill="#d7dde7" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600">Free browser aim trainer</text>
  <text x="82" y="340" fill="#d7dde7" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600">for FPS warmups</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffcf33">
    <rect x="80" y="380" width="128" height="44" rx="22" fill="rgba(255,207,51,0.12)" stroke="#ffcf33" stroke-width="2"/>
    <text x="144" y="409" text-anchor="middle">8 modes</text>
    <rect x="222" y="380" width="136" height="44" rx="22" fill="rgba(255,207,51,0.12)" stroke="#ffcf33" stroke-width="2"/>
    <text x="290" y="409" text-anchor="middle">9 themes</text>
    <rect x="372" y="380" width="178" height="44" rx="22" fill="rgba(255,207,51,0.12)" stroke="#ffcf33" stroke-width="2"/>
    <text x="461" y="409" text-anchor="middle">Leaderboards</text>
  </g>

  <!--BADGES-->

  <text x="80" y="582" fill="#8b94a7" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">nabeelmehmood.github.io/gridshot</text>
</svg>
